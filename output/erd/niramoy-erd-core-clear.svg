<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1500" viewBox="0 0 2200 1500">
<rect width="2200" height="1500" fill="#fff"/>
<style>.e{fill:#fff;stroke:#111;stroke-width:3}.h{fill:#eee;stroke:#111;stroke-width:3}.r{fill:#fff;stroke:#111;stroke-width:3}.l{fill:none;stroke:#222;stroke-width:3}.t{font:25px Georgia,serif}.n{font:bold 29px Georgia,serif}.a{font:22px Georgia,serif}.k{text-decoration:underline;font-weight:bold}.c{font:19px Georgia,serif}.title{font:bold 36px Georgia,serif}</style>
<text x="1100" y="48" text-anchor="middle" class="title">Niramoy Core Clinical ERD</text><text x="1100" y="82" text-anchor="middle" class="c">Chen notation: entities are rectangles, relationships are diamonds, and underlined fields are primary keys.</text>

<!-- entities -->
<g transform="translate(90 170)"><rect class="e" width="300" height="260" rx="8"/><rect class="h" width="300" height="55" rx="8"/><text x="150" y="36" text-anchor="middle" class="n">Patient</text><text x="18" y="95" class="a k">patient_id : UUID</text><text x="18" y="132" class="a">user_id : UUID</text><text x="18" y="169" class="a">patient_code : text</text><text x="18" y="206" class="a">district_id : text</text></g>
<g transform="translate(900 170)"><rect class="e" width="350" height="300" rx="8"/><rect class="h" width="350" height="55" rx="8"/><text x="175" y="36" text-anchor="middle" class="n">Appointment</text><text x="18" y="95" class="a k">appointment_id : UUID</text><text x="18" y="132" class="a">reference : text</text><text x="18" y="169" class="a">doctor_id : UUID</text><text x="18" y="206" class="a">patient_id : UUID</text><text x="18" y="243" class="a">start_utc / end_utc</text><text x="18" y="280" class="a">status : enum</text></g>
<g transform="translate(1700 170)"><rect class="e" width="330" height="300" rx="8"/><rect class="h" width="330" height="55" rx="8"/><text x="165" y="36" text-anchor="middle" class="n">Doctor</text><text x="18" y="95" class="a k">doctor_id : UUID</text><text x="18" y="132" class="a">user_id : UUID</text><text x="18" y="169" class="a">display_name</text><text x="18" y="206" class="a">specialty_id</text><text x="18" y="243" class="a">verification_status</text><text x="18" y="280" class="a">fee_amount</text></g>
<g transform="translate(120 740)"><rect class="e" width="300" height="260" rx="8"/><rect class="h" width="300" height="55" rx="8"/><text x="150" y="36" text-anchor="middle" class="n">Payment</text><text x="18" y="95" class="a k">payment_id : UUID</text><text x="18" y="132" class="a">appointment_id</text><text x="18" y="169" class="a">amount / currency</text><text x="18" y="206" class="a">method : enum</text><text x="18" y="243" class="a">status : enum</text></g>
<g transform="translate(560 740)"><rect class="e" width="300" height="260" rx="8"/><rect class="h" width="300" height="55" rx="8"/><text x="150" y="36" text-anchor="middle" class="n">Video_Session</text><text x="18" y="95" class="a k">appointment_id</text><text x="18" y="132" class="a">provider / room_name</text><text x="18" y="169" class="a">expires_at</text><text x="18" y="206" class="a">ended_at</text></g>
<g transform="translate(990 740)"><rect class="e" width="330" height="300" rx="8"/><rect class="h" width="330" height="55" rx="8"/><text x="165" y="36" text-anchor="middle" class="n">Medical_Record</text><text x="18" y="95" class="a k">record_id : UUID</text><text x="18" y="132" class="a">patient_id</text><text x="18" y="169" class="a">appointment_id</text><text x="18" y="206" class="a">author_user_id</text><text x="18" y="243" class="a">kind : enum</text><text x="18" y="280" class="a">is_current : boolean</text></g>
<g transform="translate(1500 740)"><rect class="e" width="330" height="300" rx="8"/><rect class="h" width="330" height="55" rx="8"/><text x="165" y="36" text-anchor="middle" class="n">Prescription</text><text x="18" y="95" class="a k">prescription_id</text><text x="18" y="132" class="a">prescription_number</text><text x="18" y="169" class="a">appointment_id</text><text x="18" y="206" class="a">patient_id / doctor_id</text><text x="18" y="243" class="a">status : enum</text><text x="18" y="280" class="a">issued_at</text></g>
<g transform="translate(450 1190)"><rect class="e" width="330" height="260" rx="8"/><rect class="h" width="330" height="55" rx="8"/><text x="165" y="36" text-anchor="middle" class="n">Review</text><text x="18" y="95" class="a k">review_id : UUID</text><text x="18" y="132" class="a">appointment_id</text><text x="18" y="169" class="a">patient_id / doctor_id</text><text x="18" y="206" class="a">rating : smallint</text><text x="18" y="243" class="a">status : enum</text></g>
<g transform="translate(1030 1190)"><rect class="e" width="330" height="260" rx="8"/><rect class="h" width="330" height="55" rx="8"/><text x="165" y="36" text-anchor="middle" class="n">AI_Visit_Summary</text><text x="18" y="95" class="a k">summary_id : UUID</text><text x="18" y="132" class="a">appointment_id</text><text x="18" y="169" class="a">doctor_id / patient_id</text><text x="18" y="206" class="a">review_status : enum</text><text x="18" y="243" class="a">published_record_id</text></g>

<!-- relationship lines and diamonds -->
<path class="l" d="M390 300H550"/><polygon class="r" points="550,300 620,255 690,300 620,345"/><text x="620" y="309" text-anchor="middle" class="t">books</text><path class="l" d="M690 300H900"/><text x="405" y="285" class="c">1</text><text x="875" y="285" class="c">0..*</text>
<path class="l" d="M1250 300H1380"/><polygon class="r" points="1380,300 1450,255 1520,300 1450,345"/><text x="1450" y="309" text-anchor="middle" class="t">attends</text><path class="l" d="M1520 300H1700"/><text x="1265" y="285" class="c">0..*</text><text x="1670" y="285" class="c">1</text>
<path class="l" d="M1075 470V555"/><polygon class="r" points="1005,555 1075,510 1145,555 1075,600"/><text x="1075" y="564" text-anchor="middle" class="t">has</text><path class="l" d="M1075 600V740"/><text x="1090" y="500" class="c">1</text><text x="1090" y="730" class="c">0..1</text>
<path class="l" d="M900 340H820V870H860"/><polygon class="r" points="860,870 930,825 1000,870 930,915"/><text x="930" y="879" text-anchor="middle" class="t">produces</text><path class="l" d="M1000 870H990"/><text x="805" y="360" class="c">1</text><text x="965" y="855" class="c">0..*</text>
<path class="l" d="M1075 470V650H665V740"/><polygon class="r" points="595,650 665,605 735,650 665,695"/><text x="665" y="659" text-anchor="middle" class="t">opens</text><text x="1090" y="490" class="c">1</text><text x="680" y="730" class="c">0..1</text>
<path class="l" d="M1075 470V660H1665V740"/><polygon class="r" points="1595,660 1665,615 1735,660 1665,705"/><text x="1665" y="669" text-anchor="middle" class="t">results in</text><text x="1680" y="730" class="c">0..*</text>
<path class="l" d="M240 1000V1110H615V1190"/><polygon class="r" points="545,1110 615,1065 685,1110 615,1155"/><text x="615" y="1119" text-anchor="middle" class="t">writes</text><text x="255" y="1025" class="c">1</text><text x="630" y="1180" class="c">0..*</text>
<path class="l" d="M1155 1040V1110H1195V1190"/><polygon class="r" points="1125,1110 1195,1065 1265,1110 1195,1155"/><text x="1195" y="1119" text-anchor="middle" class="t">drafts</text><text x="1170" y="1060" class="c">1</text><text x="1210" y="1180" class="c">0..*</text>
<path class="l" d="M1650 470V550H1880V740"/><polygon class="r" points="1810,550 1880,505 1950,550 1880,595"/><text x="1880" y="559" text-anchor="middle" class="t">issues</text><text x="1665" y="490" class="c">1</text><text x="1895" y="730" class="c">0..*</text>

<text x="1100" y="1490" text-anchor="middle" class="c">The main consultation flow is intentionally separated from directory, authentication, waitlist, audit, and safety-support tables for readability.</text>
</svg>
